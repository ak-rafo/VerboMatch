<title>Dad Bard 🪕</title>
<style>
:root{
  --bg:#17110d; --bg2:#1d1610; --card:#231a13; --card2:#2d2219; --line:#3d2f22; --text:#f3e7cf; --muted:#b19f85;
  --accent:#d6a24a; --accent2:#ecc06d; --ink:#1a1206; --good:#7cbf8a; --bad:#e07a62;
  --modern:#d6a24a; --classic:#9bb7cf; --tiki:#74bfa1; --andrew:#e88a5a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif; --r:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3e9d4; --bg2:#ede0c4; --card:#fbf5e7; --card2:#f1e5cb; --line:#dccaa5; --text:#2b1d10; --muted:#7a6650;
         --accent:#9a6b1c; --accent2:#7f5612; --ink:#fff8e8; --modern:#9a6b1c; --classic:#3e6a91; --tiki:#2c7f66; --andrew:#b4502a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg))}
body.noscroll{overflow:hidden}
a{color:var(--accent2);text-decoration:none}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 96px)}
h1{font:600 30px/1.1 var(--serif);margin:6px 0 8px;letter-spacing:.2px}
h2{font:600 13px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
h3{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
p{margin:6px 0}
.small{font-size:13px}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
.top{padding:6px 2px 4px}
.hero .brand{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.logo{width:58px;height:58px;border-radius:50%;box-shadow:0 2px 12px rgba(0,0,0,.4);flex:0 0 58px;display:block}
.hero h1{font-size:34px;margin:0}
.sym{font-size:.8em;display:inline-block;transform:rotate(-14deg);margin-left:2px}
.tagline{margin:0;font:italic 14px/1.3 var(--serif);color:var(--muted)}
.back{display:inline-block;margin:4px 0 2px;font-size:15px}
.dethead{display:flex;justify-content:space-between;align-items:center}
.editbtn{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);color:var(--text)}
.searchrow{display:flex;gap:8px}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=search]{flex:1;min-width:0}
textarea{width:100%;resize:vertical}
.full{width:100%;margin:8px 0 4px}
.btn{font:inherit;font-size:14px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap;display:inline-block}
.btn.on{border-color:var(--accent);color:var(--accent2)}
.btn.ghost{background:transparent}.btn.small{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600;width:100%;padding:13px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.filterbtn b{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px;line-height:18px;margin-left:4px;text-align:center}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:14px}
.sortrow select{padding:6px 10px;font-size:14px}
.pillbar{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.pillbar::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.pillbar button{font:inherit;font-size:14px;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.pillbar button i{font-style:normal;font-size:15px}.pillbar button span{font-size:11px;opacity:.7}
.pillbar button.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--ink);font-weight:600}
.rail{display:flex;gap:8px;overflow-x:auto;margin:12px -14px 2px;padding:2px 14px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.tile{position:relative;flex:0 0 auto;scroll-snap-align:start;min-width:78px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 8px;color:var(--text);cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:26px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:30px}
.tile span{font-size:12px;font-weight:600;white-space:nowrap}
.tile small{font-size:10px;color:var(--muted);white-space:nowrap}
.tile b{position:absolute;top:5px;right:7px;font-size:10px;color:var(--muted);font-weight:600}
.tile.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--card));box-shadow:0 0 0 1px var(--c,var(--accent)) inset}
.tile.on span{color:var(--c,var(--accent2))}
.rail.wide .tile{min-width:118px}
.rail.tools{margin-top:4px}.rail.tools .tile{flex:1;min-width:104px;padding:14px 8px 10px}.rail.tools .tile i{font-size:30px;height:36px}
.rail.stylegrid{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;margin:12px 0 2px;padding:0}
.stylegrid .tile{min-width:0;padding:10px 4px 8px;border-top:3px solid var(--c)}
.stylegrid .tile span{white-space:normal;text-align:center;line-height:1.15}
.stylegrid .tile small{white-space:normal;text-align:center;line-height:1.2}
.sheet .stylegrid .tile small{display:none}
.dotc{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 25%,transparent)}
.pillbar .dotc{width:10px;height:10px;box-shadow:none}.pillbar button.on .dotc{background:var(--ink)}
.fams .tile{min-width:96px}
.fruitdot{display:block;width:24px;height:24px;border-radius:50%;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.achip{font:inherit;font-size:12px;background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--text);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer}
.achip b{color:var(--accent2);margin-left:2px}.achip.clear{background:transparent;border-color:var(--line);color:var(--muted)}
.filterpanel{padding:10px 14px}.filterpanel .flabel{margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row.tight{align-items:center;margin-top:4px}.row.tight .pillbar{margin:0;padding:0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:21;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font:600 20px var(--serif);padding-bottom:4px}
.sheet-body{overflow-y:auto;flex:1;margin:0 -14px;padding:0 14px 10px}
.sheet .pillbar{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

(function (root, factory) {

  else root.CocktailCalc = factory();

  var SOLID = { leaf: 1, leaves: 1, slice: 1, sprig: 1, whole: 1, pinch: 1, rinse: 1, handful: 1, piece: 1, coin: 1, free: 1, garnish: 1 };

  // d = a*A^2 + b*A + c. VERIFY against your copy of Liquid Intelligence.
  var DEFAULT_COEF = { shake: [1.567, 1.742, 0.203], stir: [-1.21, 1.246, 0.145] };
  var COEF = { shake: DEFAULT_COEF.shake.slice(), stir: DEFAULT_COEF.stir.slice() };

      case 'stir': return { d: stirredDilution(A), model: 'stirred' };

      case 'freeze': return { d: 0, model: 'frozen (any water is already in the recipe)' };

    onTap('csec', function (v) { c.section = v; keep(renderCraftEditor); });
    var csn = document.getElementById('csname'); if (csn) csn.oninput = function () { craft.secName = csn.value; };
    onTap('csicon', function (v) { craft.secIcon = v; keep(renderCraftEditor); });
    document.getElementById('csave').onclick = function () {
      if (!c.t.trim()) { alert('Give it a title first.'); return; }
      var sec = c.section;
      if (sec === '__new') { var nm = (craft.secName || '').trim(); if (!nm) { alert('Name the new section.'); return; } sec = makeSection(nm, craft.secIcon).id; }
      var id = c.id || 'c-' + slug(c.t) + '-' + Date.now().toString(36);
      user.craft.items[id] = { t:c.t.trim(), section:sec, body:c.body, eq:c.eq, updated:Date.now() };
      craft.secName = ''; craft.secIcon = '📁'; save(); applyUser(); cdraft = null; location.hash = '#/t/' + id;
    };
    var cd = document.getElementById('cdel'); if (cd) cd.onclick = function () {
      if (!confirm('Delete “' + c.t + '”?')) return;
      delete user.craft.items[c.id]; delete user.tech[c.id]; save(); applyUser(); cdraft = null; location.hash = '#/tech';
    };
  }
  function renderTech(k) {
    var t = TECH[k]; if (!t) return renderTechIndex();
    var used = usedIn(k), note = user.tech[k] || '';
    var tagPill = t.tag === 'custom' ? '<span class="pill cat-andrew">' + secIcon(t.sec) + ' ' + esc(secName(t.sec)) + '</span>' :
      t.tag === 'prep' ? '<span class="pill cat-andrew">House prep</span>' : '<span class="pill ' + (t.tag === 'home' ? 'home' : 'equip') + '">' + (t.tag === 'home' ? 'Home-feasible' : 'Equipment required') + '</span>';
    var h = '<header class="top detail"><div class="dethead"><a href="#/tech" class="back">‹ Bar craft</a>' + (t.customItem ? '<a class="editbtn" href="#/craft/edit/' + encodeURIComponent(k) + '">✏️ Edit</a>' : '') + '</div><h1>' + esc(t.t) + '</h1><div class="badges">' + tagPill +
      (t.customItem ? '<span class="pill edit">✏️ Your entry</span>' : '') +
      (t.infl && t.infl !== '—' ? '<span class="pill">Influence: ' + esc(t.infl) + '</span>' : '') + '</div></header>';
    h += flagBox(t.flags || []);
    if (APO_LINK[k]) h += '<a class="apocard" href="' + APO_LINK[k] + '"><i>⚖️</i><div><b>Open the calculator</b><span>Scale it in the Apothecary</span></div><em>›</em></a>';
    if (t.mine && t.mine.length) h += '<section class="panel mine"><h2>🎻 From your notes</h2><ul class="bul">' + t.mine.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' + (t.note ? '<p class="muted small">' + esc(t.note) + '</p>' : '') + '</section>';
    if (t.missing && !note) h += '<section class="panel mine"><h2>🎻 Not written down yet</h2><p>This shows up in your specs but there’s no recipe in your notes. Add it below.</p>' + (t.note ? '<p class="muted small">' + esc(t.note) + '</p>' : '') + '</section>';
    if (t.customItem && t.body.length) h += '<section class="panel mine"><h2>🎻 Your recipe</h2><ol class="steps">' + t.body.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>' +
      (t.eq.length ? '<h3>Equipment</h3><ul class="bul">' + t.eq.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') + '</section>';
    else if (t.body.length || t.eq.length) h += '<section class="panel">' + (t.mine && t.mine.length ? '<h2>Technique</h2>' : '') + t.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      (t.eq.length ? '<h3>Equipment</h3><ul class="bul">' + t.eq.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') + '</section>';
    if (t.links) h += '<section class="panel"><h2>Reference</h2>' + t.links.map(function (l) { return '<p><a target="_blank" rel="noopener" href="' + esc(l.u) + '">' + esc(l.n) + ' ↗</a></p>'; }).join('') + '</section>';
    if (k === 'dilution-math') h += '<section class="panel"><p>' + link('#/check', 'Open Calculator check →') + '</p></section>';
    if (used.length) h += '<section class="panel"><h2>Used in</h2><div class="chips static">' + used.map(function (d) { return link('#/d/' + d.id, esc(d.name), 'chip'); }).join('') + '</div></section>';
    h += '<section class="panel"><h2>' + (t.missing ? 'Your recipe' : 'More notes') + '</h2><textarea id="tnotes" rows="6" placeholder="' + (t.missing ? 'Ratio, method, shelf life…' : 'Your method, ratios, timings…') + '">' + esc(note) + '</textarea><p class="muted small" id="saved"></p></section>';
    h += '<section class="panel hidepanel">' + (craftHidden(k)
      ? '<p class="small">Hidden from Bar craft and from links on drink pages.</p><button class="btn" id="cunhide">👁 Unhide ' + esc(t.t) + '</button>'
      : '<button class="btn ghost hidebtn" id="chide">🙈 Hide this page</button><p class="muted small">Takes it out of Bar craft and drink links. Bring it back from the bottom of the Tavern.</p>') + '</section>';
    if (craftHidden(k)) h = h.replace('</header>', '</header><div class="hidbanner">🙈 This page is hidden. <button class="btn small" id="cunhide0">Unhide</button></div>');
    $app.innerHTML = h; window.scrollTo(0, 0);
    var chb = document.getElementById('chide'); if (chb) chb.onclick = function () { user.hiddenCraft[k] = Date.now(); save(); location.hash = '#/tech'; };
    ['cunhide','cunhide0'].forEach(function (x) { var b = document.getElementById(x); if (b) b.onclick = function () { delete user.hiddenCraft[k]; save(); renderTech(k); }; });
    var tm, ta = document.getElementById('tnotes');
    ta.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { user.tech[k] = ta.value; save(); document.getElementById('saved').textContent = 'Inscribed on this device'; }, 400); };
  }

  /* ---------- tavern ---------- */
  function renderMore() {
    var tried = 0, noted = 0, ver = 0;
    Object.keys(user.drinks).forEach(function (k) { var u = user.drinks[k]; if (u.tried) tried++; if (u.notes) noted++; if (u.verified) ver++; });
    var cats = {}; DRINKS.forEach(function (d) { cats[d.cat] = (cats[d.cat] || 0) + 1; });
    var flagged = allVariants().filter(function (d) { return allFlags(d).length; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var flaggedT = Object.keys(TECH).filter(function (k) { return TECH[k].flags; });
    var missing = Object.keys(TECH).filter(function (k) { return TECH[k].missing && !user.tech[k]; });
    var mineList = allVariants().filter(function (d) { return d.custom || d.edited; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var h = '<header class="top"><h1>The Tavern</h1><p class="muted small">Ledger, settings and housekeeping.</p></header>' +
      '<section class="panel"><h2>Your tab</h2><div class="stats">' +
      '<div><b>' + tried + '</b><span>Made</span></div><div><b>' + noted + '</b><span>With notes</span></div><div><b>' + ver + '</b><span>Verified / final</span></div></div>' +
      '<p class="muted small">' + DRINKS.length + ' songs (' + allVariants().length + ' with styles): ' + (cats['Andrew’s'] || 0) + ' yours · ' + (cats.Modern || 0) + ' modern · ' + (cats.Classic || 0) + ' classic · ' + (cats.Tiki || 0) + ' tiki.</p></section>';
    h += '<section class="panel mine"><h2>✏️ My recipes & edits · ' + mineList.length + '</h2>' +
      (mineList.length ? '<ul class="todo">' + mineList.map(function (d) { return '<li>' + link('#/d/' + d.id, esc(d.name)) + '<small>' + (d.custom ? 'Custom recipe' : 'Edited') + ' · ' + esc(d.cat) + '</small></li>'; }).join('') + '</ul>' : '<p class="muted small">Nothing yet. Tap ✏️ Edit on any drink, or ＋ on the Songbook to add one.</p>') +
      '<a class="btn" href="#/new/' + encodeURIComponent('Andrew’s') + '">＋ New recipe</a></section>';
    h += '<section class="panel"><h2>Default units</h2><div class="seg"><button data-u="oz" class="' + (user.settings.unit === 'oz' ? 'on' : '') + '">oz</button><button data-u="ml" class="' + (user.settings.unit === 'ml' ? 'on' : '') + '">ml</button></div>' +
      '<p class="muted small">ml uses the bar convention of 30 ml per oz. Specs you wrote in ml stay in ml.</p></section>' +
      '<section class="panel"><h2>Back up your notes & recipes</h2><p class="small">Ratings, notes, edits and new recipes live in this browser only. Export a backup now and then, and import it on a new phone.</p>' +
      '<div class="row"><button id="exp" class="btn">Export JSON</button><label class="btn">Import JSON<input id="imp" type="file" accept="application/json" hidden></label></div><p id="iomsg" class="muted small"></p></section>' +
      '<section class="panel"><h2>Calculator</h2><p>' + link('#/check', 'Calculator check & calibration →') + '</p></section>' +
      '<section class="panel"><h2>Sources & roles</h2><ul class="bul small">' +
      '<li><b>Your notes:</b> Cocktail Notes, Organized (Andrew’s versions, originals, prep)</li>' +
      '<li><b>Modern core:</b> Death & Co, Death & Co: Welcome Home, Cocktail Codex</li>' +
      '<li><b>Taxonomy:</b> Cocktail Codex’s six roots; songbook sorted into four styles</li>' +
      '<li><b>Tiki:</b> Smuggler’s Cove, Sippin’ Safari, Tiki: Modern Tropical Cocktails</li>' +
      '<li><b>History:</b> The Oxford Companion to Spirits and Cocktails</li>' +
      '<li><b>Online cross-checks:</b> Liquor.com, Difford’s Guide, Imbibe (link-outs only)</li>' +
      '<li><b>Technique influences:</b> Dave Arnold, Jeffrey Morgenthaler, Sam Ross</li></ul></section>';
    var hid = DRINKS.filter(isHidden).sort(function (a, b) { return a.name.localeCompare(b.name); });
    h += '<section class="panel" id="hiddenpanel"><h2>🙈 Hidden songs · ' + hid.length + '</h2>' +
      (hid.length ? '<ul class="hidlist">' + hid.map(function (d) {
        return '<li><div>' + link('#/d/' + d.id, esc(d.name)) + '<small>' + esc(d.cat) + ' · ' + esc(d.pStyle) + (d.variants.length > 1 ? ' · ' + d.variants.length + ' styles' : '') + '</small></div>' +
          '<button class="btn small" data-tap="unhide" data-v="' + esc(d.id) + '">👁 Unhide</button></li>';
      }).join('') + '</ul><button class="btn ghost small" id="unhideall">Unhide all</button>'
      : '<p class="muted small">Nothing hidden. Use “🙈 Hide” at the bottom of any drink to tuck it away.</p>') + '</section>';
    var hidC = Object.keys(user.hiddenCraft).filter(function (k) { return TECH[k]; }).sort(function (a, b) { return TECH[a].t.localeCompare(TECH[b].t); });
    h += '<section class="panel" id="hiddencraft"><h2>🙈 Hidden craft pages · ' + hidC.length + '</h2>' +
      (hidC.length ? '<ul class="hidlist">' + hidC.map(function (k) {
        return '<li><div>' + link('#/t/' + k, esc(TECH[k].t)) + '<small>' + esc(TECH[k].tag === 'custom' ? secName(TECH[k].sec) : TECH[k].tag === 'prep' ? 'House prep' : TECH[k].tag === 'home' ? 'Home technique' : 'Needs gear') + '</small></div>' +
          '<button class="btn small" data-tap="cunhide" data-v="' + esc(k) + '">👁 Unhide</button></li>';
      }).join('') + '</ul><button class="btn ghost small" id="cunhideall">Unhide all</button>'
      : '<p class="muted small">Nothing hidden. Use “🙈 Hide this page” at the bottom of any Bar craft page.</p>') + '</section>';
    $app.innerHTML = h;
    onTap('cunhide', function (v) { delete user.hiddenCraft[v]; save(); keep(renderMore); });
    var cua = document.getElementById('cunhideall'); if (cua) cua.onclick = function () { user.hiddenCraft = {}; save(); keep(renderMore); };
    onTap('unhide', function (v) { delete user.hidden[v]; save(); keep(renderMore); });
    var ua = document.getElementById('unhideall'); if (ua) ua.onclick = function () { user.hidden = {}; save(); keep(renderMore); };
    if (renderMore.jump) { renderMore.jump = false; var hp = document.getElementById('hiddenpanel'); if (hp) setTimeout(function () { hp.scrollIntoView({ block:'start' }); }, 0); }
    $app.querySelectorAll('.seg button').forEach(function (b) { b.onclick = function () { user.settings.unit = b.dataset.u; save(); keep(renderMore); }; });
    document.getElementById('exp').onclick = function () {
      var blob = new Blob([JSON.stringify(user, null, 2)], { type:'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dad-bard-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
    };
    document.getElementById('imp').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try { var x = JSON.parse(r.result); if (!x.drinks) throw 0; user = x; norm(); save();
          if (user.settings.coef) Calc.setCoefficients(user.settings.coef); applyUser(); document.getElementById('iomsg').textContent = 'Imported.';
        } catch (z) { document.getElementById('iomsg').textContent = 'That file didn’t look like a Dad Bard backup.'; }
      };
      r.readAsText(f);
    };
  }
  function renderCheck() {
    var res = window.runCalcTests(Calc, DATA), f = 0, w = 0;
    res.forEach(function (r) { if (r.status === 'FAIL') f++; if (r.status === 'WARN') w++; });
    var k = Calc.getCoefficients();
    var h = '<header class="top detail"><a href="#/more" class="back">‹ Tavern</a><h1>Calculator check</h1>' +
      '<p class="small"><b class="' + (f ? 'bad' : 'good') + '">' + (res.length - f - w) + ' passed · ' + f + ' failed</b> · ' + w + ' plausibility warnings</p></header>';
    h += '<section class="panel"><h2>1 · Confirm the coefficients</h2><p class="small">Check these against <i>Liquid Intelligence</i>. Secondary sources disagree on the stirred middle term (1.246 vs 1.26). Edit, save, and every drink recalculates.</p>' +
      '<div class="coef"><span>Shaken</span>' + k.shake.map(function (v, i) { return '<input data-m="shake" data-i="' + i + '" inputmode="decimal" value="' + v + '">'; }).join('') +
      '<span>Stirred</span>' + k.stir.map(function (v, i) { return '<input data-m="stir" data-i="' + i + '" inputmode="decimal" value="' + v + '">'; }).join('') + '</div>' +
      '<p class="muted small">d = a·A² + b·A + c</p><div class="row"><button id="csave" class="btn">Save</button><button id="creset" class="btn ghost">Reset defaults</button></div></section>';
    h += '<section class="panel"><h2>2 · Weigh test (your real dilution)</h2><p class="small">Weigh the drink in the tin before ice, then weigh what you strain out. Compare with the model.</p>' +
      '<div class="weigh"><select id="wd">' + DRINKS.filter(function (d) { return ['shake','dryshake','stir'].indexOf(d.versions[d.vdef].m) > -1; }).sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (d) { return '<option value="' + d.id + '">' + esc(d.name) + '</option>'; }).join('') + '</select>' +
      '<input id="wb" inputmode="decimal" placeholder="Before (g)"><input id="wa" inputmode="decimal" placeholder="After (g)"><button id="wgo" class="btn">Compare</button></div><p id="wout" class="small"></p></section>';
    h += '<section class="panel"><h2>3 · Automated tests</h2><ul class="tests">' + res.map(function (r) {
      return '<li class="t-' + r.status.toLowerCase() + '"><b>' + r.status + '</b> ' + esc(r.name) + (r.detail ? ' <small>' + esc(r.detail) + '</small>' : '') + '</li>';
    }).join('') + '</ul><p class="muted small">Warnings flag traditional specs outside rough ABV bands. Long, low-proof or amaro-based drinks are expected to trip them.</p></section>';
    $app.innerHTML = h;
    document.getElementById('csave').onclick = function () {
      var c = { shake:[], stir:[] };
      $app.querySelectorAll('.coef input').forEach(function (i) { c[i.dataset.m][+i.dataset.i] = parseFloat(i.value); });
      if ([].concat(c.shake, c.stir).some(isNaN)) return alert('Enter numbers only.');
      user.settings.coef = c; save(); Calc.setCoefficients(c); derive(); renderCheck();
    };
    document.getElementById('creset').onclick = function () { delete user.settings.coef; save(); Calc.setCoefficients(Calc.DEFAULT_COEF); derive(); renderCheck(); };
    document.getElementById('wgo').onclick = function () {
      var d = VAR[document.getElementById('wd').value].main, b = parseFloat(document.getElementById('wb').value), a = parseFloat(document.getElementById('wa').value);
      if (!(b > 0 && a > b)) { document.getElementById('wout').textContent = 'Enter a before weight and a larger after weight.'; return; }
      var m = Calc.measuredDilution(b, a), p = d.stats.dilution;
      document.getElementById('wout').innerHTML = 'Measured <b>' + pct(m) + '</b> water vs model <b>' + pct(p) + '</b> (' + (m - p >= 0 ? '+' : '') + ((m - p) * 100).toFixed(1) + ' pts) for ' + esc(d.versions[d.vdef].label) + '.';
    };
  }

  /* ---------- router ---------- */
  function setTab(t) { document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.t === t); }); }
  function route() {
    var h = location.hash.replace(/^#/, '') || '/';
    var parts = h.split('/').filter(Boolean).map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    document.body.classList.remove('noscroll');
    if (parts[0] === 'd') {
      setTab('browse');
      var m = VAR[parts[1]] ? VAR[parts[1]].main.id : parts[1];
      if (m !== route.last) { serves = 1; window.scrollTo(0, 0); }
      route.last = m; renderDrink(parts[1]);
      if (route.keepY != null) { window.scrollTo(0, route.keepY); route.keepY = null; }
      return;
    }
    route.last = null;
    if (parts[0] === 'edit' || parts[0] === 'new') {
      setTab('browse');
      if (route.lastEdit !== h || !draft) {
        if (parts[0] === 'edit') { var vm = VAR[parts[1]]; if (!vm) { location.hash = '#/'; return; } draft = draftFromDrink(vm.main.variants[vm.i], +(parts[2] || 0)); }
        else draft = draftNew(CATS.indexOf(parts[1]) > -1 ? parts[1] : 'Andrew’s', parts[2]);
        route.lastEdit = h; window.scrollTo(0, 0);
      }
      return renderEditor();
    }
    if (parts[0] === 'craft') {
      setTab('tech');
      if (route.lastCraft !== h || !cdraft) {
        if (parts[1] === 'edit') { var ci = user.craft.items[parts[2]]; if (!ci) { location.hash = '#/tech'; return; } cdraft = { id:parts[2], t:ci.t, section:ci.section, body:ci.body || '', eq:ci.eq || '' }; }
        else { var sk = parts[2] && (BUILTIN_SEC[parts[2]] || user.craft.sections.some(function (x) { return x.id === parts[2]; })) ? parts[2] : 'prep'; cdraft = { id:null, t:'', section:sk, body:'', eq:'' }; }
        route.lastCraft = h; window.scrollTo(0, 0);
      }
      return renderCraftEditor();
    }
    route.lastCraft = null; cdraft = null;
    route.lastEdit = null; draft = null; window.scrollTo(0, 0);
    if (parts[0] === 'lineage') { setTab('lineage'); return renderLineage(); }
    if (parts[0] === 'evo') { setTab('lineage'); return window.DBViews.evoNode(parts[1]); }
    if (parts[0] === 'apothecary') { setTab('apo'); return window.DBViews.apothecary(parts[1], parts[2]); }
    if (parts[0] === 'tech') { setTab('tech'); return renderTechIndex(); }
    if (parts[0] === 't') { setTab('tech'); return renderTech(parts[1]); }
    if (parts[0] === 'more') { setTab('more'); renderMore.jump = parts[1] === 'hidden'; return renderMore(); }
    if (parts[0] === 'check') { setTab('more'); return renderCheck(); }
    setTab('browse'); renderBrowse();
  }
  window.DB = {
    get user() { return user; }, get byId() { return byId; }, save:save, keep:keep, esc:esc, link:link, tiles:tiles, pills:pills, onTap:onTap, card:card,
    bindLinMode:bindLinMode, isHidden:isHidden, ROOT_COLORS:ROOT_COLORS, TECH:TECH, ING:ING, DRINKS:DRINKS
  };
  window.addEventListener('hashchange', route);
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();

</script>
